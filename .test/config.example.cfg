[client]
hawkbit_vendor_name = FullMetalUpdate
hawkbit_url_port = 443
hawkbit_ssl = true
hawkbit_ssl_device = true
hawkbit_tenant_id = DEFAULT
hawkbit_target_name = <SOC_ID>
hawkbit_auth_token = <AUTH_TOKEN>
hawkbit_gateway_token = <GATEWAY_TOKEN>
log_level = debug
hawkbit_subdomain = otam1

hawkbit_ca_cert    = ./certs/rootCA.crt
hawkbit_client_cert = ./certs/device.crt
hawkbit_client_key  = ./certs/device.key

[ostree]
ostree_name_remote = fullmetalupdate
ostree_gpg-verify = false
ostree_ssl = true
ostree_ssl_device = true
ostree_url_port = 8000
ostreepush_ssh_port = 9022
ostreepush_ssh_user = root
ostreepush_ssh_pwd = <SSH_PASSWORD>
ostreepush_ssh_tmp = hello3
ostree_subdomain = ostreem1
ostreepush_subdomain = ostreem1

# NEW – OSTree TLS settings:
ostree_ca_cert     = ./certs/ostree.crt
ostree_client_cert = ./certs/device.crt
ostree_client_key  = ./certs/device.key

[server]
server_host_name_ip = 192.168.192.101
server_host_name_qdn = mosaicone.cloud

[dev]
enabled = true
state_dir = .state
